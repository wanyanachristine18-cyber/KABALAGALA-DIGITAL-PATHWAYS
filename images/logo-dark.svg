<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dark Theme Nocturnal Obsidian Shield -->
  <rect width="64" height="64" rx="14" fill="#0a111e" stroke="#1e3352" stroke-width="1.5"/>
  
  <!-- Cyber Cyan Ambient Glow -->
  <circle cx="32" cy="30" r="24" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Open Book Base (Midnight Slate with crisp white edge) -->
  <path d="M14 46 C22 43 28 44 32 47 C36 44 42 43 50 46 V32 C42 29 36 30 32 33 C28 30 22 29 14 32 Z" 
        fill="#111e33" stroke="#f1f5f9" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Center Book Spine Line (Luminous Gold) -->
  <line x1="32" y1="33" x2="32" y2="47" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Page Digital Traces (Cyber Gold & Neon Cyan) -->
  <path d="M22 33 C22 28 20 22 17 18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17" cy="18" r="3" fill="#fbbf24"/>
  
  <path d="M26 31 C26 24 24 19 25 14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="25" cy="14" r="2.5" fill="#38bdf8"/>

  <!-- Right Page Digital Traces (Cyber Gold & Neon Cyan) -->
  <path d="M42 33 C42 28 44 22 47 18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47" cy="18" r="3" fill="#fbbf24"/>

  <path d="M38 31 C38 24 40 19 39 14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="39" cy="14" r="2.5" fill="#38bdf8"/>

  <!-- Central Apex Pathway & Pinnacle Node with Cyber Corona -->
  <circle cx="32" cy="9" r="7" fill="#fbbf24" fill-opacity="0.2"/>
  <line x1="32" y1="33" x2="32" y2="10" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Cross-Network Interconnection Lines -->
  <line x1="25" y1="14" x2="32" y2="9" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.9"/>
  <line x1="39" y1="14" x2="32" y2="9" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.9"/>
  <line x1="17" y1="18" x2="25" y2="14" stroke="#fbbf24" stroke-width="1.2" opacity="0.9"/>
  <line x1="47" y1="18" x2="39" y2="14" stroke="#fbbf24" stroke-width="1.2" opacity="0.9"/>
</svg>

